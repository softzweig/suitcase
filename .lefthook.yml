# yaml-language-server: $schema=https://lefthook.dev/schema.json

# Hooks keep every commit type-correct so history stays bisectable; the slower
# suite and the full gate (lint, build, typecheck, test) run on push and in CI.

pre-commit:
  jobs:
    - name: biome
      glob: "*.{js,jsx,ts,tsx,json,jsonc,css,md}"
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    - name: typecheck
      run: pnpm typecheck

pre-push:
  jobs:
    - name: test
      run: pnpm test
